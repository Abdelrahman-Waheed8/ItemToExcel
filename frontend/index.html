<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item To Excel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-4xl mx-auto py-12 px-4">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-2">Item Management</h1>
            <p class="text-slate-600">Add items and export them to Excel organized by category.</p>
        </header>

        <!-- Form Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8">
            <h2 class="text-xl font-semibold text-slate-800 mb-6">Add New Item</h2>
            <form id="itemForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Item Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        placeholder="e.g. Laptop">
                </div>
                <div>
                    <label for="categoryId" class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                    <select id="categoryId" name="categoryId" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        <option value="">Select a category</option>
                    </select>
                </div>
                <div>
                    <label for="beforeDiscount" class="block text-sm font-medium text-slate-700 mb-1">Price Before Discount</label>
                    <input type="number" step="0.01" id="beforeDiscount" name="beforeDiscount" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        placeholder="0.00">
                </div>
                <div>
                    <label for="afterDiscount" class="block text-sm font-medium text-slate-700 mb-1">Price After Discount</label>
                    <input type="number" step="0.01" id="afterDiscount" name="afterDiscount" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        placeholder="0.00">
                </div>
                <div class="md:col-span-2 flex justify-end gap-4 mt-2">
                    <button type="submit" 
                        class="px-6 py-2.5 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition-all active:scale-95">
                        Add Item
                    </button>
                </div>
            </form>
        </section>

        <!-- Actions & List Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="text-xl font-semibold text-slate-800">Recent Items</h2>
                <button id="exportBtn"
                    class="flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white font-medium rounded-lg hover:bg-emerald-700 focus:ring-4 focus:ring-emerald-200 transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    Export to Excel
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="px-6 py-4 font-semibold">Name</th>
                            <th class="px-6 py-4 font-semibold">Category</th>
                            <th class="px-6 py-4 font-semibold text-right">Before</th>
                            <th class="px-6 py-4 font-semibold text-right">After</th>
                            <th class="px-6 py-4 font-semibold text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody" class="divide-y divide-slate-100 text-slate-600">
                        <!-- Items will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div id="noItemsMessage" class="py-12 text-center hidden">
                <p class="text-slate-400">No items added yet.</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
